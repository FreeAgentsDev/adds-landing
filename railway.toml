# Railway service config for the static Astro landing.
# Ensures production uses `astro build` + `astro preview`, never `astro dev`.
[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npx astro preview --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
